name: timescaledb_postgres
services:
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: rag_postgres
    restart: unless-stopped
    env_file: .env
    ports:
      - "5434:5432"
    volumes:
      # Must be a native Linux fs: Postgres requires 0700/0750 on PGDATA,
      # which the NTFS drive at /mnt/storage cannot represent.
      - "/mnt/llm/docker/data/rag_postgres/data:/home/postgres/pgdata/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shared_one

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rag_pgadmin
    restart: unless-stopped
    env_file: .env
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shared_one

networks:
  shared_one:
    external : true


