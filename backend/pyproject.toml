[project]
name = "kyoritsu-backend"
version = "1.0.1"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0,<2.1", "asyncpg>=0.30,<1",
  "alembic>=1.15,<2", "pgvector>=0.4,<1",
  "pydantic-settings>=2.8,<3", "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1", "pypdf>=5,<7",
]
[project.optional-dependencies]
models = ["torch>=2.6,<3", "transformers>=4.50,<5", "sudachipy>=0.6,<1", "sudachidict-core>=20250129"]
ocr = ["marker-pdf>=1.6,<2"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project.scripts]
rag-worker = "kyoritsu_backend.workers.ingest:main"
rag-admin = "kyoritsu_backend.cli.main:main"
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a disposable PostgreSQL database"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
